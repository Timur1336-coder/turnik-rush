name: Build Turnik Rush APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract game project
        run: |
          unzip -o TurnikRush-Android-Project.zip -d extracted

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"

      - name: Build APK
        run: |
          cd extracted/TurnikRush
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Turnik-Rush-debug-APK
          path: extracted/TurnikRush/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
